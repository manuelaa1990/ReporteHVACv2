
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector PDF E-Paper & Modo Oscuro</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        // Configurar worker de PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Personalización de temas en Tailwind
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        epaper: {
                            bg: '#f5f2eb',
                            card: '#e8e3d5',
                            text: '#1a1918',
                            border: '#d4cebe',
                            accent: '#4a463d'
                        }
                    },
                    fontFamily: {
                        serif: ['Georgia', 'Cambria', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <style>
        /* Estilos específicos para la textura y renderizado del E-Paper */
        .theme-epaper {
            background-color: #f4f0e6 !important;
            color: #111111 !important;
            background-image: radial-gradient(#e2dcd0 0.75px, transparent 0.75px);
            background-size: 12px 12px;
        }

        .theme-epaper .viewer-container {
            background-color: #f4f0e6;
        }

        .theme-epaper .pdf-page-canvas {
            /* Efecto tinta electrónica: ligeramente sepia y alto contraste suave */
            filter: sepia(20%) contrast(115%) brightness(98%);
            box-shadow: 0 4px 20px -2px rgba(60, 50, 30, 0.15);
        }

        /* Estilos específicos para el Modo Oscuro */
        .theme-dark {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }

        .theme-dark .pdf-page-canvas {
            /* Invertir colores del PDF para que el texto sea blanco y fondo oscuro */
            filter: invert(90%) hue-rotate(180deg) contrast(110%);
            box-shadow: 0 4px 25px -2px rgba(0, 0, 0, 0.7);
        }

        /* Estilo Normal */
        .theme-normal {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .theme-normal .pdf-page-canvas {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Transiciones suaves */
        .theme-transition {
            transition: background-color 0.3s ease, color 0.3s ease, filter 0.3s ease;
        }

        /* Ocultar barra de desplazamiento manteniendo funcionalidad */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans theme-normal theme-transition overflow-hidden selection:bg-amber-200 selection:text-amber-900" id="appBody">

    <header id="mainHeader" class="h-16 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 flex items-center justify-between px-4 z-20 shadow-sm transition-colors duration-300">
        <!-- Logo y Nombre -->
        <div class="flex items-center space-x-3">
            <div class="p-2 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400">
                <i data-lucide="book-open" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none">PaperReader</h1>
                <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">Lector PDF Inteligente</span>
            </div>
        </div>

        <!-- Controles Centrales: Navegación y Zoom -->
        <div id="controlsBar" class="hidden md:flex items-center space-x-2 bg-gray-100 dark:bg-gray-800/80 p-1.5 rounded-xl border border-gray-200/80 dark:border-gray-700/50">
            <!-- Paginación -->
            <div class="flex items-center space-x-1 pr-2 border-r border-gray-300 dark:border-gray-700">
                <button id="prevPage" title="Página Anterior" class="p-1.5 hover:bg-white dark:hover:bg-gray-700 rounded-lg text-gray-700 dark:text-gray-200 transition disabled:opacity-30">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center text-sm font-medium px-2">
                    <input type="number" id="pageNumInput" value="1" min="1" class="w-12 text-center bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-md py-0.5 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    <span class="mx-1 text-gray-400">/</span>
                    <span id="pageCount">0</span>
                </div>
                <button id="nextPage" title="Siguiente Página" class="p-1.5 hover:bg-white dark:hover:bg-gray-700 rounded-lg text-gray-700 dark:text-gray-200 transition disabled:opacity-30">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Zoom -->
            <div class="flex items-center space-x-1 pl-1">
                <button id="zoomOut" title="Reducir Zoom" class="p-1.5 hover:bg-white dark:hover:bg-gray-700 rounded-lg text-gray-700 dark:text-gray-200 transition">
                    <i data-lucide="zoom-out" class="w-5 h-5"></i>
                </button>
                <span id="zoomVal" class="text-xs font-semibold w-12 text-center text-gray-600 dark:text-gray-300">100%</span>
                <button id="zoomIn" title="Aumentar Zoom" class="p-1.5 hover:bg-white dark:hover:bg-gray-700 rounded-lg text-gray-700 dark:text-gray-200 transition">
                    <i data-lucide="zoom-in" class="w-5 h-5"></i>
                </button>
                <button id="fitWidth" title="Ajustar Ancho" class="p-1.5 hover:bg-white dark:hover:bg-gray-700 rounded-lg text-gray-700 dark:text-gray-200 transition ml-1">
                    <i data-lucide="maximize-2" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Acciones Derecha: Modos de Vista y Cargar PDF -->
        <div class="flex items-center space-x-2">
            <!-- Selector de Modos -->
            <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl border border-gray-200 dark:border-gray-700" id="themeSelector">
                <button id="btnThemeNormal" title="Modo Normal" class="px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition active-theme bg-white text-gray-900 shadow-sm">
                    <i data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
                    <span class="hidden sm:inline">Normal</span>
                </button>
                <button id="btnThemeEPaper" title="Modo E-Paper (Tinta Electrónica)" class="px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 text-gray-600 dark:text-gray-300 hover:text-gray-900 transition">
                    <i data-lucide="tablet" class="w-4 h-4 text-emerald-700"></i>
                    <span class="hidden sm:inline">E-Paper</span>
                </button>
                <button id="btnThemeDark" title="Modo Oscuro" class="px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 text-gray-600 dark:text-gray-300 hover:text-gray-900 transition">
                    <i data-lucide="moon" class="w-4 h-4 text-indigo-400"></i>
                    <span class="hidden sm:inline">Oscuro</span>
                </button>
            </div>

            <!-- Botón Abrir Archivo -->
            <label for="pdfFileInput" class="cursor-pointer bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white px-4 py-2 rounded-xl text-xs font-medium flex items-center space-x-2 shadow-sm transition">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Subir PDF</span>
            </label>
            <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden">
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col items-center justify-center">
        
        <!-- Vista vacía / Drop Zone -->
        <div id="uploadPlaceholder" class="max-w-md w-full mx-4 p-8 bg-white dark:bg-gray-800 rounded-3xl border-2 border-dashed border-gray-300 dark:border-gray-700 text-center shadow-lg transition-all hover:border-amber-500">
            <div class="w-16 h-16 bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="file-up" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-1">Cargar documento PDF</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-6">Selecciona un archivo PDF para disfrutar de una lectura cómoda y optimizada.</p>
            
            <label for="pdfFileInput" class="inline-flex items-center justify-center px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-medium text-sm cursor-pointer shadow-md transition space-x-2">
                <i data-lucide="file-plus" class="w-4 h-4"></i>
                <span>Seleccionar Archivo</span>
            </label>
        </div>

        <!-- Indicador de Carga -->
        <div id="loadingSpinner" class="hidden absolute inset-0 bg-white/70 dark:bg-gray-900/70 backdrop-blur-sm flex flex-col items-center justify-center z-30">
            <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-sm font-semibold text-gray-700 dark:text-gray-200" id="loadingText">Procesando PDF...</p>
        </div>

        <!-- Lector de PDF (Contenedor con Scroll) -->
        <div id="pdfViewerContainer" class="hidden w-full h-full overflow-auto p-4 sm:p-8 flex justify-center items-start viewer-container relative">
            <div id="canvasWrapper" class="relative transition-all duration-200">
                <canvas id="pdfCanvas" class="pdf-page-canvas rounded-lg transition-all duration-300 block"></canvas>
            </div>
        </div>

        <!-- Barra flotante de navegación móvil -->
        <div id="mobileControls" class="hidden md:hidden absolute bottom-6 bg-white/90 dark:bg-gray-800/90 backdrop-blur border border-gray-200 dark:border-gray-700 px-4 py-2 rounded-full shadow-2xl items-center space-x-4 z-20">
            <button id="prevPageMobile" class="p-2 text-gray-700 dark:text-gray-200">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
                <span id="pageNumMobile">1</span> / <span id="pageCountMobile">0</span>
            </span>
            <button id="nextPageMobile" class="p-2 text-gray-700 dark:text-gray-200">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>
    </main>

    <script>
        // Variables de estado del Lector
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.2;
        let currentTheme = 'normal'; // 'normal', 'epaper', 'dark'

        // Referencias a elementos del DOM
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const pdfFileInput = document.getElementById('pdfFileInput');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const pdfViewerContainer = document.getElementById('pdfViewerContainer');
        const controlsBar = document.getElementById('controlsBar');
        const mobileControls = document.getElementById('mobileControls');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const appBody = document.getElementById('appBody');

        // Referencias a botones de temas
        const btnNormal = document.getElementById('btnThemeNormal');
        const btnEPaper = document.getElementById('btnThemeEPaper');
        const btnDark = document.getElementById('btnThemeDark');

        // Inicializar Iconos Lucide
        lucide.createIcons();

        /**
         * Renderiza la página actual del documento PDF
         */
        function renderPage(num) {
            pageRendering = true;
            showLoading(true, "Renderizando página...");

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                
                // Ajustar resolución de Canvas para pantallas High-DPI (Retina)
                const outputScale = window.devicePixelRatio || 1;

                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = Math.floor(viewport.height) + "px";

                const transform = outputScale !== 1 
                    ? [outputScale, 0, 0, outputScale, 0, 0] 
                    : null;

                const renderContext = {
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    showLoading(false);

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            // Actualizar indicadores de página
            document.getElementById('pageNumInput').value = num;
            document.getElementById('pageNumMobile').textContent = num;
            updatePaginationButtons();
        }

        /**
         * Encola la representación de una página si otra está en proceso
         */
        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        /**
         * Cambia a la página anterior
         */
        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        /**
         * Cambia a la siguiente página
         */
        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        /**
         * Actualiza estado desactivado/activado de botones de paginación
         */
        function updatePaginationButtons() {
            const isFirst = pageNum <= 1;
            const isLast = pdfDoc ? pageNum >= pdfDoc.numPages : true;

            document.getElementById('prevPage').disabled = isFirst;
            document.getElementById('nextPage').disabled = isLast;
            document.getElementById('prevPageMobile').disabled = isFirst;
            document.getElementById('nextPageMobile').disabled = isLast;
        }

        /**
         * Carga el archivo PDF seleccionado desde el sistema local
         */
        function loadPDF(file) {
            if (!file || file.type !== 'application/pdf') {
                alert('Por favor selecciona un archivo PDF válido.');
                return;
            }

            showLoading(true, "Cargando archivo PDF...");

            const fileReader = new FileReader();
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);

                pdfjsLib.getDocument(typedarray).promise.then(function(pdfDoc_) {
                    pdfDoc = pdfDoc_;
                    
                    // Actualizar UI
                    document.getElementById('pageCount').textContent = pdfDoc.numPages;
                    document.getElementById('pageCountMobile').textContent = pdfDoc.numPages;
                    
                    uploadPlaceholder.classList.add('hidden');
                    pdfViewerContainer.classList.remove('hidden');
                    controlsBar.classList.remove('hidden');
                    controlsBar.classList.add('flex');
                    mobileControls.classList.remove('hidden');
                    mobileControls.classList.add('flex');

                    pageNum = 1;
                    renderPage(pageNum);
                }).catch(function(error) {
                    showLoading(false);
                    alert('Error al abrir el PDF: ' + error.message);
                });
            };

            fileReader.readAsArrayBuffer(file);
        }

        /**
         * Cambia el tema visual de la aplicación
         */
        function setTheme(theme) {
            currentTheme = theme;
            
            // Limpiar clases de tema
            appBody.classList.remove('theme-normal', 'theme-epaper', 'theme-dark', 'dark');
            
            // Restablecer estilos de botones de tema
            [btnNormal, btnEPaper, btnDark].forEach(btn => {
                btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 text-gray-600 dark:text-gray-300 hover:text-gray-900 transition";
            });

            const activeBtnClass = "px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition active-theme bg-white text-gray-900 shadow-sm dark:bg-gray-700 dark:text-white";

            if (theme === 'epaper') {
                appBody.classList.add('theme-epaper');
                btnEPaper.className = activeBtnClass;
            } else if (theme === 'dark') {
                appBody.classList.add('theme-dark', 'dark');
                btnDark.className = activeBtnClass;
            } else {
                appBody.classList.add('theme-normal');
                btnNormal.className = activeBtnClass;
            }
        }

        function zoomIn() {
            if (scale >= 3.0) return;
            scale += 0.2;
            updateZoomDisplay();
            if (pdfDoc) queueRenderPage(pageNum);
        }

        function zoomOut() {
            if (scale <= 0.5) return;
            scale -= 0.2;
            updateZoomDisplay();
            if (pdfDoc) queueRenderPage(pageNum);
        }

        function fitToWidth() {
            if (!pdfDoc) return;
            pdfDoc.getPage(pageNum).then(function(page) {
                const containerWidth = pdfViewerContainer.clientWidth - 64; // Margen interno
                const viewport = page.getViewport({ scale: 1.0 });
                scale = containerWidth / viewport.width;
                updateZoomDisplay();
                queueRenderPage(pageNum);
            });
        }

        function updateZoomDisplay() {
            document.getElementById('zoomVal').textContent = `${Math.round(scale * 100)}%`;
        }

        function showLoading(show, text = "") {
            if (show) {
                loadingSpinner.classList.remove('hidden');
                document.getElementById('loadingText').textContent = text;
            } else {
                loadingSpinner.classList.add('hidden');
            }
        }

        // Selección de archivo por input
        pdfFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) loadPDF(file);
        });

        // Soporte Drag and Drop
        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                loadPDF(e.dataTransfer.files[0]);
            }
        });

        // Eventos de Paginación
        document.getElementById('prevPage').addEventListener('click', onPrevPage);
        document.getElementById('nextPage').addEventListener('click', onNextPage);
        document.getElementById('prevPageMobile').addEventListener('click', onPrevPage);
        document.getElementById('nextPageMobile').addEventListener('click', onNextPage);

        // Input de cambio directo de página
        document.getElementById('pageNumInput').addEventListener('change', function(e) {
            const val = parseInt(e.target.value);
            if (pdfDoc && val >= 1 && val <= pdfDoc.numPages) {
                pageNum = val;
                queueRenderPage(pageNum);
            } else {
                e.target.value = pageNum;
            }
        });

        // Eventos de Zoom
        document.getElementById('zoomIn').addEventListener('click', zoomIn);
        document.getElementById('zoomOut').addEventListener('click', zoomOut);
        document.getElementById('fitWidth').addEventListener('click', fitToWidth);

        // Eventos de Botones de Tema
        btnNormal.addEventListener('click', () => setTheme('normal'));
        btnEPaper.addEventListener('click', () => setTheme('epaper'));
        btnDark.addEventListener('click', () => setTheme('dark'));

        // Atajos de Teclado
        document.addEventListener('keydown', function(e) {
            if (!pdfDoc) return;
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                onNextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                onPrevPage();
            } else if (e.key === '+' || (e.ctrlKey && e.key === '=')) {
                e.preventDefault();
                zoomIn();
            } else if (e.key === '-' || (e.ctrlKey && e.key === '-')) {
                e.preventDefault();
                zoomOut();
            }
        });
    </script>
</body>
</html>
